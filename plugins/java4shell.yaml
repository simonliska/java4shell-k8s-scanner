apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: java4shell
spec:
  version: v0.2.0
  homepage: https://github.com/simonliska/java4shell-k8s-scanner
  shortDescription: Find pods exposed to java4shell (CVE-2026-114938)
  description: |
    Reports which pods are actually exposed to java4shell (CVE-2026-114938):
    an affected JDK on a node whose CPU has avx512vbmi, with no mitigation
    flag set. Also flags pods that could be rescheduled onto such nodes.
    Needs Node Feature Discovery in the cluster.
  platforms:
    - selector:
        matchLabels: {os: linux, arch: amd64}
      uri: https://github.com/simonliska/java4shell-k8s-scanner/releases/download/v0.2.0/kubectl-java4shell_linux_amd64.tar.gz
      sha256: 9f5e0516f99d9ed38df52be05093fc323afe62d031f4385d8fff96440b8f2c99
      bin: kubectl-java4shell
    - selector:
        matchLabels: {os: linux, arch: arm64}
      uri: https://github.com/simonliska/java4shell-k8s-scanner/releases/download/v0.2.0/kubectl-java4shell_linux_arm64.tar.gz
      sha256: 360a7f4b7252331412a3067311d304187107f9e52ff1a17813daf69fdcbe5c66
      bin: kubectl-java4shell
    - selector:
        matchLabels: {os: darwin, arch: amd64}
      uri: https://github.com/simonliska/java4shell-k8s-scanner/releases/download/v0.2.0/kubectl-java4shell_darwin_amd64.tar.gz
      sha256: f606cbe75cfc84b8cf595e7734d0e52b1e2ab1b74a50f3942a9e4e90b3d9d145
      bin: kubectl-java4shell
    - selector:
        matchLabels: {os: darwin, arch: arm64}
      uri: https://github.com/simonliska/java4shell-k8s-scanner/releases/download/v0.2.0/kubectl-java4shell_darwin_arm64.tar.gz
      sha256: 16a82e53e26e56a8c3b07382e5cd671ce5d56faccfe83687864cbc1824c963e7
      bin: kubectl-java4shell
    - selector:
        matchLabels: {os: windows, arch: amd64}
      uri: https://github.com/simonliska/java4shell-k8s-scanner/releases/download/v0.2.0/kubectl-java4shell_windows_amd64.tar.gz
      sha256: 8aed3152b4707b4e2057e16c5468b878304ac36629b44930db40fdd54b7eeb61
      bin: kubectl-java4shell.exe
    - selector:
        matchLabels: {os: windows, arch: arm64}
      uri: https://github.com/simonliska/java4shell-k8s-scanner/releases/download/v0.2.0/kubectl-java4shell_windows_arm64.tar.gz
      sha256: 0efe71bd3324118481f1d876c72c5ee429545b6e549ca0d51732a4c2e4c58109
      bin: kubectl-java4shell.exe
